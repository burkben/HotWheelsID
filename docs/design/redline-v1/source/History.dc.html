<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090F}
a{color:#2BD1FF}a:hover{color:#8DE6FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07090F; color: #F5F7FA; font-family: 'Barlow', system-ui, sans-serif">

  <header style="position: absolute; left: 16px; right: 16px; top: 58px; display: flex; align-items: flex-end; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 52px; line-height: 0.85; letter-spacing: -0.5px">HISTORY</h1>
    <button type="button" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #2BD1FF; font-family: 'Barlow', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Clear</button>
  </header>

  <!-- 14-day strip -->
  <section style="position: absolute; left: 16px; right: 16px; top: 122px; background: #111620; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 17px">LAST 14 DAYS</span>
      <span style="font-family: 'Chakra Petch', monospace; font-size: 11px; letter-spacing: 1px; color: #A3B1C2">9 SESSIONS · 126 PASSES</span>
    </div>
    <div role="img" aria-label="Sessions per day over the last 14 days, busiest today" style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="14">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div style="width: 100%; height: 30px; background: {{d.fill}}; transform: skewX(-10deg); box-shadow: {{d.ring}}"></div>
          <span style="font-family: 'Chakra Petch', monospace; font-size: 10px; color: {{d.ink}}">{{d.letter}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8494A6">
      <span>Fewer</span>
      <span style="width: 12px; height: 8px; background: #161C27"></span>
      <span style="width: 12px; height: 8px; background: #5A2A0E"></span>
      <span style="width: 12px; height: 8px; background: #A8460C"></span>
      <span style="width: 12px; height: 8px; background: #FF6A13"></span>
      <span>More</span>
    </div>
  </section>

  <!-- sessions -->
  <div style="position: absolute; left: 16px; right: 16px; top: 268px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: 1px">{{g.label}}</span>
          <span style="flex: 1; height: 1px; background: rgba(163,177,194,0.18)"></span>
        </div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <a href="Results.dc.html" style="position: relative; height: 76px; background: #111620; display: flex; align-items: stretch; text-decoration: none; color: #F5F7FA; overflow: hidden; box-shadow: {{r.edge}}">
            <div style="width: 58px; flex-shrink: 0; background: #1A2230; display: flex; flex-direction: column; align-items: center; justify-content: center">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 28px; line-height: 0.9">{{r.day}}</span>
              <span style="font-family: 'Chakra Petch', monospace; font-weight: 600; font-size: 10px; letter-spacing: 1.5px; color: #A3B1C2">{{r.month}}</span>
            </div>
            <div style="width: 0; border-left: 2px dashed #07090F"></div>
            <div style="flex: 1; min-width: 0; padding: 0 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="font-family: 'Chakra Petch', monospace; font-weight: 600; font-size: 16px">{{r.time}}</span>
                <sc-if value="{{r.live}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; font-family: 'Chakra Petch', monospace; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; color: #39D98A"><span style="width: 6px; height: 6px; border-radius: 50%; background: #39D98A"></span>LIVE</span>
                </sc-if>
              </div>
              <span style="font-size: 13px; color: #A3B1C2">{{r.meta}}</span>
            </div>
            <svg width="58" height="76" viewBox="0 0 58 24" preserveAspectRatio="none" aria-hidden="true" style="flex-shrink: 0">
              <polyline points="{{r.spark}}" fill="none" stroke="{{r.sparkColor}}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
            </svg>
            <div style="width: 70px; flex-shrink: 0; padding-right: 12px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center">
              <span style="font-family: 'Chakra Petch', monospace; font-weight: 700; font-size: 24px; line-height: 1; color: {{r.bestColor}}">{{r.best}}</span>
              <span style="font-family: 'Chakra Petch', monospace; font-size: 10px; letter-spacing: 1px; color: #8494A6">BEST MPH</span>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- tab bar -->
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #0B0E15; border-top: 1px solid rgba(163,177,194,0.14); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 24px; box-sizing: border-box">
    <a href="Speed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">SPEED</span>
    </a>
    <a href="Countdown.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h13l-2.5 4 2.5 4H5"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">RACE</span>
    </a>
    <a href="Garage.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12"></path><path d="M7 21v-8h10v8"></path><path d="M7 17h10"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">GARAGE</span>
    </a>
    <a href="History.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FF6A13; text-decoration: none">
      <span style="position: absolute; top: -1px; left: 24%; right: 24%; height: 3px; background: #FF6A13; transform: skewX(-24deg)"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M12 8v4l3 2"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">HISTORY</span>
    </a>
    <a href="Achievements.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">MORE</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var FILL = ['#161C27', '#5A2A0E', '#A8460C', '#FF6A13'];
    var counts = [0, 1, 0, 0, 2, 0, 3, 1, 0, 0, 2, 1, 0, 3];
    var letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S', 'M', 'T', 'W', 'T', 'F', 'S', 'S'];
    var days = counts.map(function (c, i) {
      var today = i === counts.length - 1;
      return {
        fill: FILL[c],
        ring: today ? '0 0 0 2px #F5F7FA' : 'none',
        ink: today ? '#F5F7FA' : '#8494A6',
        letter: letters[i]
      };
    });
    function row(day, month, time, meta, best, spark, opts) {
      opts = opts || {};
      return {
        day: day, month: month, time: time, meta: meta, best: best, spark: spark,
        live: !!opts.live,
        edge: opts.live ? 'inset 0 3px 0 #39D98A' : 'none',
        sparkColor: opts.record ? '#FFD23F' : '#FF6A13',
        bestColor: opts.record ? '#FFD23F' : '#F5F7FA'
      };
    }
    return {
      days: days,
      groups: [
        { label: 'TODAY', rows: [
          row('04', 'OCT', '7:42 PM', '14 passes · 12 min so far', '247', '0,18 6,14 12,16 18,9 24,12 30,7 36,10 42,5 48,8 54,2', { live: true, record: true }),
          row('04', 'OCT', '4:15 PM', '22 passes · 18 min', '226', '0,16 6,12 12,15 18,11 24,13 30,8 36,12 42,9 48,11 54,7')
        ]},
        { label: 'THIS WEEK', rows: [
          row('02', 'OCT', '6:03 PM', '9 passes · 7 min', '214', '0,20 6,15 12,17 18,12 24,14 30,10 36,13 42,11 48,14 54,9'),
          row('01', 'OCT', '5:30 PM', '31 passes · 26 min', '231', '0,14 6,17 12,11 18,13 24,8 30,12 36,6 42,9 48,7 54,10'),
          row('30', 'SEP', '7:10 PM', '12 passes · 9 min', '198', '0,19 6,17 12,20 18,15 24,17 30,13 36,16 42,12 48,15 54,13')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
