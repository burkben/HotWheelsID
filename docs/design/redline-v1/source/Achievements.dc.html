<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trophy case</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090F}
a{color:#2BD1FF}a:hover{color:#8DE6FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07090F; color: #F5F7FA; font-family: 'Barlow', system-ui, sans-serif">

  <header style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; flex-direction: column; gap: 8px">
    <a href="Speed.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 32px; color: #2BD1FF; text-decoration: none; font-size: 16px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>More
    </a>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 46px; line-height: 0.85">TROPHY CASE</h1>
      <span style="font-family: 'Chakra Petch', monospace; font-weight: 700; font-size: 22px; line-height: 1"><span style="color: #FFD23F">8</span><span style="color: #8494A6">/13</span></span>
    </div>
    <div role="img" aria-label="8 of 13 trophies unlocked" style="height: 8px; background: #161C27; overflow: hidden">
      <div style="width: 61.5%; height: 100%; background: repeating-linear-gradient(-45deg, #FFD23F 0 8px, #F5F7FA 8px 16px)"></div>
    </div>
  </header>

  <!-- latest unlock -->
  <section style="position: absolute; left: 16px; right: 16px; top: 184px; height: 84px; background: #111620; display: flex; align-items: center; gap: 14px; padding: 0 14px; overflow: hidden">
    <svg style="position: absolute; right: -8px; bottom: -6px; opacity: 0.9" width="120" height="70" viewBox="0 0 120 96" aria-hidden="true">
      <path d="M44 96 C50 66 40 46 60 12 C64 42 82 54 80 84 C88 72 90 60 86 46 C104 66 102 84 96 96 Z" fill="#FF6A13" fill-opacity="0.35"></path>
      <path d="M6 96 C10 70 0 56 16 32 C20 54 32 62 30 82 C38 70 40 58 38 44 C54 62 54 82 48 96 Z" fill="#FF6A13" fill-opacity="0.25"></path>
    </svg>
    <svg width="58" height="66" viewBox="0 0 56 64" aria-hidden="true" style="flex-shrink: 0">
      <path d="M28 2 L54 17 L54 47 L28 62 L2 47 L2 17 Z" fill="#FF6A13"></path>
      <path d="M28 8 L49 20 L49 44 L28 56 L7 44 L7 20 Z" fill="none" stroke="#07090F" stroke-width="2"></path>
      <svg x="16" y="20" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#07090F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-3 1-6 1-9z"></path></svg>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Chakra Petch', monospace; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: #FF6A13">LATEST UNLOCK</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 26px; line-height: 1">INTO THE RED</span>
      <span style="font-size: 13px; color: #A3B1C2">Hit the redline — 240 mph.</span>
    </div>
  </section>

  <!-- groups -->
  <div style="position: absolute; left: 16px; right: 16px; top: 288px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: 1px">{{g.name}}</span>
          <span style="flex: 1; height: 1px; background: rgba(163,177,194,0.18)"></span>
          <span style="font-family: 'Chakra Petch', monospace; font-size: 11px; color: #8494A6">{{g.count}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px">
          <sc-for list="{{g.items}}" as="a" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: {{a.opacity}}">
              <svg width="50" height="57" viewBox="0 0 56 64" aria-hidden="true">
                <path d="M28 2 L54 17 L54 47 L28 62 L2 47 L2 17 Z" fill="{{a.fill}}" stroke="{{a.ring}}" stroke-width="3"></path>
                <svg x="16" y="20" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg>
              </svg>
              <span style="font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; color: {{a.text}}">{{a.title}}</span>
              <sc-if value="{{a.hasProgress}}" hint-placeholder-val="{{ false }}">
                <span style="font-family: 'Chakra Petch', monospace; font-size: 10px; color: #A3B1C2">{{a.progress}}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <!-- tab bar -->
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #0B0E15; border-top: 1px solid rgba(163,177,194,0.14); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 24px; box-sizing: border-box">
    <a href="Speed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">SPEED</span>
    </a>
    <a href="Countdown.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h13l-2.5 4 2.5 4H5"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">RACE</span>
    </a>
    <a href="Garage.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12"></path><path d="M7 21v-8h10v8"></path><path d="M7 17h10"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">GARAGE</span>
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8494A6; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M12 8v4l3 2"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">HISTORY</span>
    </a>
    <a href="Achievements.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FF6A13; text-decoration: none">
      <span style="position: absolute; top: -1px; left: 24%; right: 24%; height: 3px; background: #FF6A13; transform: skewX(-24deg)"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 12px; letter-spacing: 1px">MORE</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ICON = {
      gauge: 'M4 17a8 8 0 1 1 16 0M12 17l4-5',
      bolt: 'M13 2L5 14h6l-1 8 8-12h-6z',
      flame: 'M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-3 1-6 1-9z',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
      flag: 'M5 21V4M5 4h13l-2.5 4 2.5 4H5',
      repeat: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
      laps: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l3 2M10 2h4',
      road: 'M8 3L4 21M16 3l4 18M12 5v2M12 11v2M12 17v2',
      watch: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4M9 2h6M19 5l1.5-1.5',
      car: 'M3 15l2.5-5h13L21 15v3H3zM7 18v2M17 18v2M6.5 13.5h.01M17.5 13.5h.01',
      key: 'M14 10a4 4 0 1 0-3.5 4L10 15v2h2v2h2l1.5-1.5M15 7h.01',
      grid: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
      stack: 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5'
    };
    function item(title, icon, unlocked, progress) {
      return {
        title: title,
        icon: ICON[icon],
        fill: unlocked ? '#1A2230' : '#0D1119',
        ring: unlocked ? '#FFD23F' : '#2E3A4D',
        ink: unlocked ? '#F5F7FA' : '#6E7D8E',
        text: unlocked ? '#F5F7FA' : '#A3B1C2',
        opacity: 1,
        hasProgress: !!progress,
        progress: progress || ''
      };
    }
    return {
      groups: [
        { name: 'SPEED', count: '3/4', items: [
          item('Getting Going', 'gauge', true),
          item('Quick', 'bolt', true),
          item('Into the Red', 'flame', true),
          item('Redline Hero', 'star', false, 'BEST 247/290')
        ]},
        { name: 'RACING', count: '3/5', items: [
          item('First Finish', 'flag', true),
          item('Regular Racer', 'repeat', true),
          item('Sub-3 Lap', 'watch', true),
          item('Century of Laps', 'laps', false, '64/100'),
          item('Marathon', 'road', false)
        ]},
        { name: 'GARAGE', count: '2/4', items: [
          item('New Wheels', 'key', true),
          item('Small Garage', 'car', true),
          item('Collector', 'grid', false, '6/10'),
          item('Hoarder', 'stack', false, '6/25')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
